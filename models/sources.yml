version: 2

sources:
  - name: bronze
    description: Bronze layer raw retail tables

    database: PACIFIC_RETAIL_DB
    schema: BRONZE

    tables:
      - name: raw_customer
        description: Raw customer table

      - name: raw_product
        description: Raw product table

      - name: raw_orders
        description: Raw orders table

        config:
          loaded_at_field: transaction_date

          freshness:
            warn_after:
              count: 24
              period: hour

            error_after:
              count: 48
              period: hour